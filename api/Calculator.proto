syntax = "proto3";

import "google/protobuf/timestamp.proto";
option go_package = "./api";

service Calculator {
  rpc Calc (CalcRequest) returns (CalcAnswer) {}
  rpc Register (AuthRequest) returns (AuthReply) {}
  rpc Login (AuthRequest) returns (AuthReply) {}
}

service Logger {
  rpc StreamEvents (stream Event) returns (EventReply) {}
}

message Event {
  string user = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message EventReply {
  bool received = 1;
}

message CalcRequest {
  string name = 1;
  double num1 = 2;
  double num2 = 3;
  string operation = 4;

}

message CalcAnswer {
  double result = 1;
}

message AuthRequest {
  string username = 1;
  string password = 2;
}

message AuthReply {
  string message = 1;
}