syntax = "proto3";


option go_package = "./api";

service Calculator {
  rpc Calc (CalcRequest) returns (CalcAnswer) {}
  rpc Register (AuthRequest) returns (AuthReply) {}
  rpc Login (AuthRequest) returns (AuthReply) {}
}

message CalcRequest {
  string name = 1;
  double num1 = 2;
  double num2 = 3;
  string operation = 4;

}

message CalcAnswer {
  double result = 1;
}

message AuthRequest {
  string username = 1;
  string password = 2;
}

message AuthReply {
  string message = 1;
}